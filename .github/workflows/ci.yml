name: ci

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore StaffFinancePlatform.slnx
      - name: Build
        run: dotnet build StaffFinancePlatform.slnx --no-restore --configuration Release
      - name: Test
        run: dotnet test StaffFinancePlatform.slnx --no-build --configuration Release
